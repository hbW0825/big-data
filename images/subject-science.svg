<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sciGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6"/>
      <stop offset="100%" style="stop-color:#8E44AD"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sciGrad)"/>
  <circle cx="500" cy="80" r="90" fill="white" opacity="0.06"/>
  <circle cx="100" cy="350" r="70" fill="white" opacity="0.06"/>
  <!-- Flask -->
  <g transform="translate(240, 40)">
    <rect x="45" y="0" width="30" height="10" rx="2" fill="white" opacity="0.8"/>
    <rect x="48" y="10" width="24" height="60" fill="white" opacity="0.8"/>
    <polygon points="35,130 85,130 72,70 48,70" fill="white" opacity="0.8"/>
    <ellipse cx="60" cy="130" rx="27" ry="8" fill="white" opacity="0.6"/>
    <!-- Bubbles -->
    <circle cx="52" cy="100" r="5" fill="#9B59B6" opacity="0.6"/>
    <circle cx="65" cy="90" r="4" fill="#9B59B6" opacity="0.5"/>
    <circle cx="58" cy="110" r="6" fill="#9B59B6" opacity="0.7"/>
  </g>
  <!-- Atom -->
  <g transform="translate(400, 80)">
    <ellipse cx="40" cy="40" rx="35" ry="15" fill="none" stroke="white" stroke-width="2" opacity="0.5" transform="rotate(-30, 40, 40)"/>
    <ellipse cx="40" cy="40" rx="35" ry="15" fill="none" stroke="white" stroke-width="2" opacity="0.5" transform="rotate(30, 40, 40)"/>
    <ellipse cx="40" cy="40" rx="35" ry="15" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
    <circle cx="40" cy="40" r="6" fill="white" opacity="0.8"/>
  </g>
  <text x="300" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="white">科 学</text>
  <text x="300" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="white" opacity="0.8">物理 · 化学 · 生物</text>
  <text x="300" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="white" opacity="0.6">Science &amp; Technology</text>
</svg>
