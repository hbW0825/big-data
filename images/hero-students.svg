<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD93D"/>
      <stop offset="100%" style="stop-color:#FF9A3C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#heroGrad)"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="100" r="120" fill="white" opacity="0.05"/>
  <circle cx="700" cy="450" r="80" fill="white" opacity="0.05"/>
  <circle cx="100" cy="500" r="60" fill="white" opacity="0.05"/>
  <!-- Student 1 -->
  <g transform="translate(150, 180)">
    <circle cx="50" cy="30" r="35" fill="#FFE0B2"/>
    <circle cx="38" cy="25" r="5" fill="#333"/>
    <circle cx="62" cy="25" r="5" fill="#333"/>
    <path d="M38 42 Q50 52 62 42" fill="none" stroke="#333" stroke-width="2.5"/>
    <ellipse cx="50" cy="5" rx="38" ry="25" fill="#4A3728"/>
    <rect x="25" y="65" width="50" height="70" rx="10" fill="#6BCB77"/>
    <rect x="15" y="70" width="20" height="50" rx="5" fill="#6BCB77"/>
    <rect x="65" y="70" width="20" height="50" rx="5" fill="#6BCB77"/>
  </g>
  <!-- Student 2 -->
  <g transform="translate(350, 150)">
    <circle cx="50" cy="30" r="38" fill="#FFE0B2"/>
    <circle cx="37" cy="25" r="5" fill="#333"/>
    <circle cx="63" cy="25" r="5" fill="#333"/>
    <path d="M37 45 Q50 55 63 45" fill="none" stroke="#333" stroke-width="2.5"/>
    <ellipse cx="50" cy="3" rx="40" ry="27" fill="#8B4513"/>
    <rect x="22" y="68" width="56" height="75" rx="10" fill="#4D96FF"/>
    <rect x="10" y="75" width="22" height="55" rx="5" fill="#4D96FF"/>
    <rect x="68" y="75" width="22" height="55" rx="5" fill="#4D96FF"/>
  </g>
  <!-- Student 3 -->
  <g transform="translate(550, 190)">
    <circle cx="50" cy="30" r="34" fill="#FFE0B2"/>
    <circle cx="38" cy="25" r="5" fill="#333"/>
    <circle cx="62" cy="25" r="5" fill="#333"/>
    <path d="M38 42 Q50 52 62 42" fill="none" stroke="#333" stroke-width="2.5"/>
    <ellipse cx="50" cy="5" rx="36" ry="24" fill="#1a1a2e"/>
    <rect x="25" y="64" width="50" height="68" rx="10" fill="#FF6B6B"/>
    <rect x="15" y="69" width="20" height="48" rx="5" fill="#FF6B6B"/>
    <rect x="65" y="69" width="20" height="48" rx="5" fill="#FF6B6B"/>
  </g>
  <!-- Books stack -->
  <g transform="translate(250, 420)">
    <rect x="0" y="0" width="300" height="35" rx="5" fill="#FF6B6B"/>
    <rect x="20" y="38" width="260" height="35" rx="5" fill="#6BCB77"/>
    <rect x="40" y="76" width="220" height="35" rx="5" fill="#4D96FF"/>
    <rect x="60" y="114" width="180" height="35" rx="5" fill="#FFD93D"/>
  </g>
  <!-- Text -->
  <text x="400" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="white" opacity="0.9">快乐学习 · 共同成长</text>
</svg>
