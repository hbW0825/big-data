<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="mathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB"/>
      <stop offset="100%" style="stop-color:#2980B9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#mathGrad)"/>
  <circle cx="500" cy="80" r="100" fill="white" opacity="0.08"/>
  <circle cx="80" cy="320" r="70" fill="white" opacity="0.08"/>
  <!-- Math symbols -->
  <text x="150" y="130" font-family="Arial,sans-serif" font-size="60" fill="white" opacity="0.3">π</text>
  <text x="420" y="100" font-family="Arial,sans-serif" font-size="50" fill="white" opacity="0.3">∑</text>
  <text x="80" y="200" font-family="Arial,sans-serif" font-size="40" fill="white" opacity="0.2">√</text>
  <text x="480" y="220" font-family="Arial,sans-serif" font-size="45" fill="white" opacity="0.2">∞</text>
  <!-- Calculator shape -->
  <g transform="translate(230, 60)">
    <rect x="0" y="0" width="140" height="180" rx="10" fill="white" opacity="0.9"/>
    <rect x="15" y="15" width="110" height="40" rx="5" fill="#3498DB"/>
    <text x="70" y="42" text-anchor="middle" font-family="monospace" font-size="20" fill="white">123+45</text>
    <rect x="15" y="70" width="25" height="25" rx="3" fill="#ECF0F1"/>
    <rect x="50" y="70" width="25" height="25" rx="3" fill="#ECF0F1"/>
    <rect x="85" y="70" width="25" height="25" rx="3" fill="#ECF0F1"/>
    <rect x="15" y="105" width="25" height="25" rx="3" fill="#ECF0F1"/>
    <rect x="50" y="105" width="25" height="25" rx="3" fill="#ECF0F1"/>
    <rect x="85" y="105" width="25" height="25" rx="3" fill="#ECF0F1"/>
    <rect x="15" y="140" width="25" height="25" rx="3" fill="#ECF0F1"/>
    <rect x="50" y="140" width="25" height="25" rx="3" fill="#ECF0F1"/>
    <rect x="85" y="140" width="25" height="25" rx="3" fill="#3498DB"/>
    <text x="97" y="158" text-anchor="middle" font-family="Arial" font-size="14" fill="white">=</text>
  </g>
  <text x="300" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="white">数 学</text>
  <text x="300" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="white" opacity="0.8">计算 · 几何 · 应用题</text>
  <text x="300" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="white" opacity="0.6">Mathematics</text>
</svg>
